name: Deploy web to GitHub Pages

# Builds the Expo web export on GitHub's runners and publishes it to GitHub
# Pages, giving the club a public URL (https://<owner>.github.io/booknote/).
# Requires the repository to be public (or a plan that includes Pages for
# private repos), with Pages source set to "GitHub Actions" — the
# configure-pages step below enables that automatically.

on:
  push:
    branches: [claude/determined-cerf-ejtyez]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let the newest finish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Export web build
        run: npx expo export --platform web

      # GitHub Pages runs Jekyll by default, which ignores folders that start
      # with an underscore — Expo serves assets from _expo/, so disable it.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
